<!doctype html>

    <title>Smart Permit & Smart Ri'ayah | Pesantren Modern Darul Ulum</title>

    <!-- Security & Anti-Data-Leak: Padamkan semua output console di domain publik (production) -->
    <script>
      (function () {
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (!isLocal) {
          var noop = function () {};
          var methods = [
            'log', 'debug', 'info', 'warn', 'error', 'table', 'trace',
            'dir', 'dirxml', 'group', 'groupCollapsed', 'groupEnd',
            'time', 'timeEnd', 'timeLog', 'count', 'assert', 'clear'
          ];
          for (var i = 0; i < methods.length; i++) {
            try {
              window.console[methods[i]] = noop;
            } catch (e) {}
          }
          // Blokir pencatatan error runtime ke console publik
          window.addEventListener('error', function (e) {
            e.preventDefault();
            return true;
          });
          window.addEventListener('unhandledrejection', function (e) {
            e.preventDefault();
          });
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
